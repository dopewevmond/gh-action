services:
  gh_action:
    container_name: ${DOCKER_CONTAINER_NAME}
    build:
      context: .
      args:
        NODE_ENV: ${NODE_ENV}
    # restart: always
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 5
    environment:
      - DOCKER_CONTAINER_NAME=${DOCKER_CONTAINER_NAME}
      - NODE_ENV=${NODE_ENV}
      - SERVER_PORT=${SERVER_PORT}
      - HOST_NAME=${HOST_NAME}
      - APP_NAME=${APP_NAME}
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    volumes:
      - ./public:/app/public
      - ./private:/app/private